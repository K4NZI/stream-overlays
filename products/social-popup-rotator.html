.toast.on{opacity:1}

function build(it,g){

const T=t=>[{opacity:0,transform:t},{opacity:1,transform:'none'}];
const KF={fade:[{opacity:0},{opacity:1}],slideLeft:T('translateX(-70px)'),slideRight:T('translateX(70px)'),slideUp:T('translateY(46px)'),slideDown:T('translateY(-46px)'),

 glitch:[{opacity:0,transform:'translateX(-10px) skewX(10deg)'},{opacity:1,transform:'translateX(8px) skewX(-8deg)'},{opacity:.3,transform:'translateX(-5px)'},{opacity:1,transform:'translateX(4px) skewX(4deg)'},{opacity:1,transform:'none'}],
 blur:[{opacity:0,filter:'blur(16px)'},{opacity:1,filter:'blur(0px)'}],
 modern:[{opacity:0,transform:'translateY(14px) scale(.97)',clipPath:'inset(0 100% 0 0)'},{opacity:1,transform:'none',clipPath:'inset(0 0 0 0)'}],
 flipX:[{opacity:0,transform:'perspective(800px) rotateX(-90deg)'},{opacity:1,transform:'none'}],
 flipY:[{opacity:0,transform:'perspective(800px) rotateY(-90deg)'},{opacity:1,transform:'none'}],
 zoom:T('scale(1.4)'),

/* ===== rotator engine: single active popup, one cancellable timer ===== */
function Rot(host,getC){let tok=0,tm=0,a=null;
 const sleep=ms=>new Promise(r=>{tm=setTimeout(r,ms)});
 const stop=()=>{tok++;clearTimeout(tm);if(a){a.cancel();a=null}host.replaceChildren()};
 const go=async(pop,name,out)=>{const f=KF[name];if(!f)return;
  a=pop.animate(out?[...f].reverse().map(x=>x.offset!=null?{...x,offset:1-x.offset}:x):f,{duration:out?420:560,easing:out?'cubic-bezier(.4,0,1,1)':'cubic-bezier(.16,1,.3,1)',fill:out?'forwards':'backwards'});
  try{await a.finished}catch(e){}};
 const start=async(o={})=>{stop();const my=tok;let i=0;
  while(my===tok){
   const c=getC(),L=o.pick?o.pick(c):c.items;
   if(!L.length){if(o.once)break;await sleep(1000);continue}
   if(i>=L.length){if(o.once)break;i=0}
   const it=L[i++];layout(host,c.g);
   const{wrap,pop}=build(it,c.g);place(wrap,c.g);pop.style.visibility='hidden';host.replaceChildren(wrap);
   await Promise.race([Promise.all([...pop.querySelectorAll('img')].map(m=>m.decode().catch(()=>0))),new Promise(r=>setTimeout(r,1000))]);
   if(my!==tok)return;
   pop.style.visibility='';sfx(it,c.g);await go(pop,it.enter,0);if(my!==tok)return;
   await sleep(it.dur*1000);if(my!==tok)return;
   await go(pop,it.exit,1);if(my!==tok)return;
   a=null;host.replaceChildren();
   if(o.once&&i>=L.length)break;
   await sleep(it.gap*1000);if(my!==tok)return}
  if(my===tok){host.replaceChildren();o.done&&o.done()}};
 return{start,stop}}

/* ===== image processing ===== */
async function shrink(f,s){const u=URL.createObjectURL(f);
 try{const im=new Image();im.src=u;await im.decode();const m=Math.min(im.width,im.height),c=document.createElement('canvas');
  c.width=c.height=Math.min(s,m);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,c.width,c.height);
  let d=c.toDataURL('image/webp',.82);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',.82);return d}
 finally{URL.revokeObjectURL(u)}}

 try{ok=document.execCommand('copy')}catch(_){}t.remove();return ok}}
